<!-- Haul v1.0.1 -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="description" content="Haul – route optimiser for delivery planners">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Haul">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%231a1a2e'/%3E%3Ctext x='256' y='340' text-anchor='middle' font-family='system-ui' font-weight='900' font-size='300' fill='%23f0c040'%3EH%3C/text%3E%3C/svg%3E">

  <title>Haul</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f0f1a;
      --surface: #1a1a2e;
      --border:  #2e2e4a;
      --accent:  #f0c040;
      --accent2: #e05a2b;
      --text:    #e8e8f0;
      --muted:   #888899;
      --danger:  #e05a2b;
      --radius:  6px;
      --font:    'Inter', system-ui, sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.5;
    }

    a { color: var(--accent); }

    #app {
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 16px 80px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
    }

    #app-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--accent);
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      line-height: 1;
    }
    #app-title span { display: inline-block; transition: transform 0.1s; }
    #app-title span:active { transform: scale(0.92); }

    #btn-install {
      display: none;
      background: var(--accent);
      color: #0f0f1a;
      border: none;
      border-radius: var(--radius);
      padding: 8px 14px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }

    #ios-banner {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .field-group { margin-bottom: 20px; }

    .field-row {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 8px;
    }

    input[type="text"] {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 15px;
      padding: 10px 12px;
      outline: none;
      width: 100%;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    input[type="text"]::placeholder { color: var(--muted); }
    input[type="text"][readonly] {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .stop-postcode { width: 130px; min-width: 100px; flex-shrink: 0; text-transform: uppercase; }
    .stop-postcode::placeholder { text-transform: none; }
    .stop-label    { flex: 1; }

    .btn-remove {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 18px;
      line-height: 1;
      padding: 6px 10px;
      cursor: pointer;
      flex-shrink: 0;
    }
    .btn-remove:hover { border-color: var(--danger); color: var(--danger); }

    #btn-add-stop {
      background: none;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
      font-size: 13px;
      padding: 9px 14px;
      cursor: pointer;
      width: 100%;
      text-align: left;
      transition: border-color 0.15s, color 0.15s;
    }
    #btn-add-stop:hover { border-color: var(--accent); color: var(--accent); }

    .btn-primary {
      background: var(--accent);
      color: #0f0f1a;
      border: none;
      border-radius: var(--radius);
      padding: 13px 22px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 4px;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

    #status {
      margin: 16px 0;
      font-size: 13px;
      color: var(--muted);
      min-height: 20px;
    }
    #status.error { color: var(--danger); }

    #results { margin-top: 28px; display: none; }

    #results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      flex-wrap: wrap;
      gap: 8px;
    }

    #results-header h2 {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Route summary bar ── */
    #route-summary {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .summary-pill {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 13px;
      color: var(--text);
      white-space: nowrap;
    }
    .summary-pill span {
      color: var(--accent);
      font-weight: 700;
    }

    /* ── Stop list ── */
    #stop-list {
      list-style: none;
      margin-bottom: 20px;
    }

    #stop-list li {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--border);
    }
    #stop-list li:last-child { border-bottom: none; }

    .stop-num {
      background: var(--accent);
      color: #0f0f1a;
      font-size: 11px;
      font-weight: 900;
      min-width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .stop-num.start-dot { background: var(--accent2); }

    .stop-info { flex: 1; }
    .stop-info .stop-name { font-weight: 600; font-size: 15px; }
    .stop-info .stop-pc   { font-size: 12px; color: var(--muted); margin-top: 1px; }

    /* ── Leg meta (distance + time) ── */
    .leg-meta {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }

    .leg-tag {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(240,192,64,0.1);
      color: var(--accent);
      border: 1px solid rgba(240,192,64,0.2);
    }
    .leg-tag.time-tag {
      background: rgba(224,90,43,0.1);
      color: #f08060;
      border-color: rgba(224,90,43,0.2);
    }
    .leg-tag.arrive-tag {
      background: rgba(100,180,100,0.1);
      color: #88cc88;
      border-color: rgba(100,180,100,0.2);
    }

    /* ── Action buttons ── */
    .action-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn-action {
      flex: 1;
      min-width: 140px;
      border: none;
      border-radius: var(--radius);
      padding: 13px 16px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .btn-action:hover { opacity: 0.88; }

    #btn-maps  { background: #4285f4; color: #fff; }
    #btn-copy  { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
    #btn-reset { background: var(--surface); color: var(--muted); border: 1px solid var(--border); font-size: 13px; width: 100%; margin-top: 10px; }

    .divider { height: 1px; background: var(--border); margin: 24px 0; }

    /* ── Easter egg ── */
    #egg-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #egg-overlay.active { display: flex; }
    #egg-canvas { display: block; max-width: 100vw; image-rendering: pixelated; }
    #egg-close {
      position: absolute;
      top: 14px; right: 14px;
      background: rgba(255,255,255,0.1);
      border: none; color: #fff;
      font-size: 22px; padding: 6px 12px;
      border-radius: 4px; cursor: pointer;
    }
    #app-version {
      font-size: 11px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.5px;
      margin-left: 8px;
      vertical-align: middle;
      opacity: 0.7;
    }

    #egg-hud {
      position: absolute;
      top: 14px; left: 14px;
      color: #f0c040;
      font-family: monospace;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div id="app">
  <header>
    <div id="app-title"><span>Haul</span><span id="app-version">v1.0.1</span></div>
    <button id="btn-install">Install App</button>
  </header>

  <div id="ios-banner">
    To install Haul on your home screen: tap the Share button in Safari, then choose "Add to Home Screen".
  </div>

  <div class="field-group">
    <div class="section-label">Warehouse (start)</div>
    <input type="text" id="start-postcode" value="KA11 4HP" readonly>
  </div>

  <div class="field-group">
    <div class="section-label">Delivery stops</div>
    <div id="stops-container"></div>
    <button id="btn-add-stop">+ Add stop</button>
  </div>

  <button class="btn-primary" id="btn-optimise">Optimise route</button>

  <div id="status"></div>

  <div id="results">
    <div class="divider"></div>
    <div id="results-header">
      <h2>Optimised route</h2>
    </div>
    <div id="route-summary"></div>
    <ul id="stop-list"></ul>
    <div class="action-row">
      <a id="btn-maps" class="btn-action" target="_blank" rel="noopener">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>
        Open in Google Maps
      </a>
      <button id="btn-copy" class="btn-action">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
        Copy route
      </button>
    </div>
    <button id="btn-reset" class="btn-action">Clear and start over</button>
  </div>
</div>

<div id="egg-overlay">
  <div id="egg-hud">HAUL RIDER &nbsp;|&nbsp; SCORE: <span id="egg-score">0</span> &nbsp;|&nbsp; LIVES: <span id="egg-lives">3</span></div>
  <canvas id="egg-canvas" width="480" height="320"></canvas>
  <button id="egg-close">✕</button>
</div>

<script>
// ── VERSION ──
const APP_VERSION = 'v1.0.1';

// ── PWA MANIFEST ──
(function() {
  const manifest = {
    name: 'Haul', short_name: 'Haul',
    description: 'Delivery route optimiser',
    start_url: './', display: 'standalone',
    orientation: 'portrait-primary',
    theme_color: '#1a1a2e', background_color: '#0f0f1a',
    icons: [{
      src: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='80' fill='%231a1a2e'/%3E%3Ctext x='256' y='340' text-anchor='middle' font-family='system-ui' font-weight='900' font-size='300' fill='%23f0c040'%3EH%3C/text%3E%3C/svg%3E",
      sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable'
    }]
  };
  const blob = new Blob([JSON.stringify(manifest)], {type:'application/manifest+json'});
  const link = Object.assign(document.createElement('link'), {rel:'manifest', href:URL.createObjectURL(blob)});
  document.head.appendChild(link);
})();

// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  const sw = `
    const CACHE='haul-v2';
    self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./'])));self.skipWaiting();});
    self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))));self.clients.claim();});
    self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(CACHE).then(ca=>ca.put(e.request,c));return r;}).catch(()=>caches.match(e.request)));});
  `;
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
}

// ── ANDROID INSTALL ──
let deferredPrompt = null;
const btnInstall = document.getElementById('btn-install');
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; btnInstall.style.display = 'block'; });
btnInstall.addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') btnInstall.style.display = 'none';
  deferredPrompt = null;
});

// ── iOS BANNER ──
(function() {
  const ua = navigator.userAgent;
  if (/iphone|ipad|ipod/i.test(ua) && /safari/i.test(ua) && !/crios|fxios|opios/i.test(ua) && !navigator.standalone) {
    document.getElementById('ios-banner').style.display = 'block';
  }
})();

// ── STOPS UI ──
const stopsContainer = document.getElementById('stops-container');
let stopCount = 0;

function addStop(postcode='', label='') {
  if (stopCount >= 20) return;
  stopCount++;
  const row = document.createElement('div');
  row.className = 'field-row';
  row.innerHTML = `
    <input type="text" class="stop-postcode" placeholder="Postcode" value="${postcode}" autocomplete="off" spellcheck="false">
    <input type="text" class="stop-label" placeholder="Label (e.g. Drop A)" value="${label}" autocomplete="off">
    <button class="btn-remove" title="Remove">×</button>
  `;
  row.querySelector('.btn-remove').addEventListener('click', () => { row.remove(); stopCount = Math.max(0, stopCount - 1); });
  stopsContainer.appendChild(row);
}

addStop(); addStop(); addStop();
document.getElementById('btn-add-stop').addEventListener('click', () => addStop());

// ── UTILS ──
function haversine(a, b) {
  const R = 6371, dLat = (b.lat-a.lat)*Math.PI/180, dLon = (b.lng-a.lng)*Math.PI/180;
  const s = Math.sin(dLat/2)**2 + Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1-s));
}

function normPC(pc) { return pc.trim().toUpperCase().replace(/\s+/g,' '); }

function setStatus(msg, isError=false) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = isError ? 'error' : '';
}

function fmtMins(mins) {
  if (mins < 60) return `${Math.round(mins)} min`;
  const h = Math.floor(mins/60), m = Math.round(mins%60);
  return m === 0 ? `${h}h` : `${h}h ${m}m`;
}

function fmtDist(km) {
  return km < 1 ? `${Math.round(km*1000)} m` : `${km.toFixed(1)} km`;
}

// ── GEOCODE ──
async function geocodeAll(postcodes) {
  const body = { postcodes: postcodes.map(p => p.replace(/\s/g,'')) };
  const r = await fetch('https://api.postcodes.io/postcodes', {
    method: 'POST',
    headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  const j = await r.json();
  if (j.status !== 200) throw new Error('Geocoding failed');
  return j.result.map((item, i) => {
    if (!item.result) throw new Error(`Unknown postcode: ${postcodes[i]}`);
    return { lat: item.result.latitude, lng: item.result.longitude };
  });
}

// ── OSRM – returns { distKm[][], durMins[][] } or null ──
async function osrmMatrix(coords) {
  const coordStr = coords.map(c => `${c.lng},${c.lat}`).join(';');
  const url = `https://router.project-osrm.org/table/v1/driving/${coordStr}?annotations=distance,duration`;
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 10000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(t);
    const j = await r.json();
    if (j.code !== 'Ok') return null;
    return {
      distKm:  j.distances.map(row => row.map(d => d / 1000)),
      durMins: j.durations.map(row => row.map(d => d / 60))
    };
  } catch {
    clearTimeout(t);
    return null;
  }
}

// ── NEAREST-NEIGHBOUR on duration ──
// Returns tour order and per-leg { distKm, durMins } pairs
function nearestNeighbour(distKm, durMins, startIdx) {
  const n = distKm.length;
  const visited = new Array(n).fill(false);
  const tour = [startIdx];
  const legs = []; // leg[i] = travel from tour[i] to tour[i+1]
  let current = startIdx;
  visited[startIdx] = true;

  for (let step = 1; step < n; step++) {
    let best = Infinity, bestIdx = -1;
    for (let j = 0; j < n; j++) {
      if (!visited[j] && durMins[current][j] < best) {
        best = durMins[current][j];
        bestIdx = j;
      }
    }
    visited[bestIdx] = true;
    legs.push({ distKm: distKm[current][bestIdx], durMins: durMins[current][bestIdx] });
    tour.push(bestIdx);
    current = bestIdx;
  }
  return { tour, legs };
}

// ── MAIN OPTIMISE ──
document.getElementById('btn-optimise').addEventListener('click', optimise);

async function optimise() {
  const btn = document.getElementById('btn-optimise');
  btn.disabled = true;
  document.getElementById('results').style.display = 'none';

  const startPc = normPC(document.getElementById('start-postcode').value);

  const rows = Array.from(stopsContainer.querySelectorAll('.field-row'));
  const stops = rows.map(r => ({
    postcode: normPC(r.querySelector('.stop-postcode').value),
    label: r.querySelector('.stop-label').value.trim() || r.querySelector('.stop-postcode').value.trim()
  })).filter(s => s.postcode);

  if (stops.length < 2) { setStatus('Add at least 2 stops.', true); btn.disabled = false; return; }

  setStatus('Geocoding postcodes…');
  let allCoords;
  try {
    allCoords = await geocodeAll([startPc, ...stops.map(s => s.postcode)]);
  } catch(err) {
    setStatus(err.message, true); btn.disabled = false; return;
  }

  setStatus('Building route matrix…');
  let matrices = await osrmMatrix(allCoords);

  let usingFallback = false;
  if (!matrices) {
    usingFallback = true;
    setStatus('OSRM unavailable – using straight-line distances…');
    const hav = allCoords.map(a => allCoords.map(b => haversine(a, b)));
    // Estimate duration from haversine at ~50 km/h average
    matrices = {
      distKm: hav,
      durMins: hav.map(row => row.map(d => (d / 50) * 60))
    };
  }

  setStatus('Optimising route…');
  const { tour, legs } = nearestNeighbour(matrices.distKm, matrices.durMins, 0);

  // tour[0] = start (index 0); rest are stop indices (1-based → stops[i-1])
  const orderedStops = tour.slice(1).map((idx, i) => ({
    ...stops[idx - 1],
    leg: legs[i]  // travel TO this stop from previous
  }));

  renderResults(startPc, orderedStops, usingFallback);
  setStatus('');
  btn.disabled = false;
}

// ── RENDER ──
const STOP_DWELL_MINS = 15;

function renderResults(startPc, orderedStops, fallback) {
  const list = document.getElementById('stop-list');
  list.innerHTML = '';

  // Running totals
  let totalDistKm = 0, totalDriveMin = 0;
  const totalStopMin = orderedStops.length * STOP_DWELL_MINS;
  orderedStops.forEach(s => {
    totalDistKm  += s.leg.distKm;
    totalDriveMin += s.leg.durMins;
  });
  const totalMin = totalDriveMin + totalStopMin;

  // Summary bar
  const summaryEl = document.getElementById('route-summary');
  summaryEl.innerHTML = `
    <div class="summary-pill"><span>${fmtDist(totalDistKm)}</span> total distance</div>
    <div class="summary-pill"><span>${fmtMins(totalDriveMin)}</span> drive time</div>
    <div class="summary-pill"><span>${fmtMins(totalStopMin)}</span> stop time (${orderedStops.length} × 15 min)</div>
    <div class="summary-pill"><span>${fmtMins(totalMin)}</span> overall</div>
    ${fallback ? '<div class="summary-pill" style="color:var(--danger);border-color:var(--danger)">Estimated distances (OSRM unavailable)</div>' : ''}
  `;

  // Start row
  const liStart = document.createElement('li');
  liStart.innerHTML = `
    <div class="stop-num start-dot">S</div>
    <div class="stop-info">
      <div class="stop-name">Warehouse</div>
      <div class="stop-pc">${startPc} – 18 Macadam Place, Irvine</div>
    </div>
  `;
  list.appendChild(liStart);

  // Cumulative time tracker (drive only for "depart", drive+dwell for "arrive next")
  let elapsed = 0; // minutes since leaving warehouse

  orderedStops.forEach((stop, i) => {
    const driveMin = stop.leg.durMins;
    const arriveMin = elapsed + driveMin;
    const departMin = arriveMin + STOP_DWELL_MINS;
    elapsed = departMin;

    const li = document.createElement('li');
    li.innerHTML = `
      <div class="stop-num">${i + 1}</div>
      <div class="stop-info">
        <div class="stop-name">${stop.label || stop.postcode}</div>
        <div class="stop-pc">${stop.postcode}</div>
        <div class="leg-meta">
          <span class="leg-tag">${fmtDist(stop.leg.distKm)}</span>
          <span class="leg-tag time-tag">${fmtMins(driveMin)} drive</span>
          <span class="leg-tag arrive-tag">~+${fmtMins(arriveMin)} from start</span>
        </div>
      </div>
    `;
    list.appendChild(li);
  });

  // Google Maps URL
  const waypoints = [startPc, ...orderedStops.map(s => s.postcode)];
  document.getElementById('btn-maps').href =
    'https://www.google.com/maps/dir/' + waypoints.map(p => encodeURIComponent(p)).join('/');

  document.getElementById('results').style.display = 'block';
  document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
}

// ── COPY ROUTE ──
document.getElementById('btn-copy').addEventListener('click', () => {
  const lines = [];
  const items = document.querySelectorAll('#stop-list li');
  items.forEach((li, i) => {
    const name   = li.querySelector('.stop-name')?.textContent || '';
    const pc     = li.querySelector('.stop-pc')?.textContent || '';
    const dist   = li.querySelector('.leg-tag')?.textContent || '';
    const drive  = li.querySelectorAll('.leg-tag')[1]?.textContent || '';
    const timing = li.querySelectorAll('.leg-tag')[2]?.textContent || '';
    if (i === 0) {
      lines.push(`Start: ${name} (${pc})`);
    } else {
      lines.push(`${i}. ${name} (${pc})  |  ${dist}  |  ${drive}  |  ${timing}`);
    }
  });

  const summary = document.getElementById('route-summary');
  const pills = Array.from(summary.querySelectorAll('.summary-pill')).map(p => p.textContent.trim());
  lines.unshift('HAUL – Optimised Route');
  lines.unshift('');
  lines.unshift(pills.join('  ·  '));
  lines.unshift('');

  navigator.clipboard.writeText(lines.join('\n')).then(() => {
    const btn = document.getElementById('btn-copy');
    const orig = btn.innerHTML;
    btn.textContent = 'Copied!';
    setTimeout(() => { btn.innerHTML = orig; }, 2000);
  });
});

// ── RESET ──
document.getElementById('btn-reset').addEventListener('click', () => {
  stopsContainer.innerHTML = '';
  stopCount = 0;
  addStop(); addStop(); addStop();
  document.getElementById('results').style.display = 'none';
  setStatus('');
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ── EASTER EGG ──
(function() {
  const title    = document.getElementById('app-title');
  const overlay  = document.getElementById('egg-overlay');
  const canvas   = document.getElementById('egg-canvas');
  const ctx      = canvas.getContext('2d');
  const closeBtn = document.getElementById('egg-close');
  let tapCount = 0, tapTimer = null, raf = null, active = false;

  title.addEventListener('click', () => {
    tapCount++;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { tapCount = 0; }, 1400);
    if (tapCount >= 7) { tapCount = 0; launchGame(); }
  });

  closeBtn.addEventListener('click', stopGame);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && active) stopGame(); });

  const W = 480, H = 320, GROUND = 230, ROAD_TOP = 170, ROAD_BOT = 280;
  let score, lives, speed, frameCount, player, packages, houses, obstacles, particles;
  let keys = {};

  document.addEventListener('keydown', e => { if (active) keys[e.code] = true; });
  document.addEventListener('keyup',   e => { keys[e.code] = false; });

  let touchStartX = 0;
  canvas.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
  canvas.addEventListener('touchend',   e => {
    if (!active) return;
    if (Math.abs(e.changedTouches[0].clientX - touchStartX) < 30) throwPkg();
  });

  function launchGame() {
    resetGame();
    overlay.classList.add('active');
    active = true;
    raf = requestAnimationFrame(loop);
  }

  function stopGame() {
    active = false;
    overlay.classList.remove('active');
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    keys = {};
  }

  function resetGame() {
    score = 0; lives = 3; speed = 2.2; frameCount = 0;
    player = { x:80, y:GROUND-28, w:28, h:28, vy:0, onGround:true, throwing:false };
    packages = []; houses = []; obstacles = []; particles = [];
    updateHUD();
    for (let i = 0; i < 4; i++) spawnHouse(W + i * 220 + 80);
    spawnObstacle(W + 300);
  }

  function updateHUD() {
    document.getElementById('egg-score').textContent = score;
    document.getElementById('egg-lives').textContent = lives;
  }

  function spawnHouse(x) { houses.push({ x, y:ROAD_TOP-60, w:56, h:60, delivered:false, flashTimer:0 }); }
  function spawnObstacle(x) { obstacles.push({ x, y:GROUND-18, w:20, h:18 }); }

  function throwPkg() {
    if (!active) return;
    packages.push({ x:player.x+24, y:player.y+8, vx:speed+4, vy:-3, w:10, h:8 });
    player.throwing = true;
    setTimeout(() => { player.throwing = false; }, 180);
  }

  function spawnParticles(x, y, color) {
    for (let i = 0; i < 10; i++) {
      particles.push({ x, y, vx:(Math.random()-.5)*4, vy:(Math.random()-.5)*4-2, s:Math.random()*5+2, color, life:30, maxLife:30 });
    }
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0,0,0,ROAD_TOP);
    g.addColorStop(0,'#0a0a1a'); g.addColorStop(1,'#1a2040');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,ROAD_TOP);
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 30; i++) {
      ctx.fillRect((i*137+frameCount*.3)%W, (i*73)%(ROAD_TOP-10), i%3===0?2:1, i%3===0?2:1);
    }
  }

  function drawRoad() {
    ctx.fillStyle='#2a2a3a'; ctx.fillRect(0,ROAD_TOP,W,ROAD_BOT-ROAD_TOP);
    ctx.fillStyle='#888'; ctx.fillRect(0,ROAD_TOP,W,4); ctx.fillRect(0,ROAD_BOT,W,4);
    ctx.fillStyle='#555';
    const off = (frameCount*speed)%68;
    for (let x=-40+off; x<W+40; x+=68) ctx.fillRect(x,(ROAD_TOP+ROAD_BOT)/2-2,28,4);
    ctx.fillStyle='#3a3a2a'; ctx.fillRect(0,ROAD_BOT,W,H-ROAD_BOT);
    ctx.fillStyle='#2a2a1a'; ctx.fillRect(0,ROAD_BOT+4,W,6);
  }

  function drawHouse(h) {
    const f = h.flashTimer > 0;
    ctx.fillStyle = f?'#f0c040':'#3a4060'; ctx.fillRect(h.x,h.y+24,h.w,h.h-24);
    ctx.fillStyle = f?'#ffdd20':'#c0392b';
    ctx.beginPath(); ctx.moveTo(h.x-4,h.y+24); ctx.lineTo(h.x+h.w/2,h.y); ctx.lineTo(h.x+h.w+4,h.y+24); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#1a1a2e'; ctx.fillRect(h.x+h.w/2-6,h.y+h.h-18,12,18);
    ctx.fillStyle=f?'#fff':'#f0c040'; ctx.fillRect(h.x+6,h.y+30,12,10);
    if (!h.delivered) { ctx.fillStyle='#f0c040'; ctx.fillRect(h.x+h.w/2-8,h.y+h.h-10,16,4); }
  }

  function drawPlayer() {
    const p = player;
    ctx.fillStyle='#f0c040'; ctx.fillRect(p.x+4,p.y+14,20,8);
    ctx.fillStyle='#e8e8f0';
    ctx.beginPath(); ctx.arc(p.x+7,p.y+24,6,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x+21,p.y+24,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1a1a2e';
    ctx.beginPath(); ctx.arc(p.x+7,p.y+24,2,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(p.x+21,p.y+24,2,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#f5cba7'; ctx.beginPath(); ctx.arc(p.x+16,p.y+6,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#e05a2b'; ctx.beginPath(); ctx.arc(p.x+16,p.y+4,7,Math.PI,0); ctx.fill();
    if (p.throwing) { ctx.fillStyle='#f5cba7'; ctx.fillRect(p.x+20,p.y+10,10,4); }
    ctx.fillStyle='#555'; ctx.fillRect(p.x-2,p.y+10,8,10);
  }

  function drawPackage(pkg) {
    ctx.fillStyle='#f0c040'; ctx.fillRect(pkg.x,pkg.y,pkg.w,pkg.h);
    ctx.strokeStyle='#e05a2b'; ctx.lineWidth=1.5; ctx.strokeRect(pkg.x,pkg.y,pkg.w,pkg.h);
    ctx.beginPath(); ctx.moveTo(pkg.x+pkg.w/2,pkg.y); ctx.lineTo(pkg.x+pkg.w/2,pkg.y+pkg.h); ctx.stroke();
    ctx.lineWidth=1;
  }

  function drawObstacle(o) {
    ctx.fillStyle='#e05a2b';
    ctx.beginPath(); ctx.moveTo(o.x+o.w/2,o.y); ctx.lineTo(o.x+o.w,o.y+o.h); ctx.lineTo(o.x,o.y+o.h); ctx.closePath(); ctx.fill();
    ctx.fillStyle='#fff'; ctx.fillRect(o.x+4,o.y+o.h*.4,o.w-8,3);
    ctx.fillStyle='#2a2a2a'; ctx.fillRect(o.x,o.y+o.h,o.w,3);
  }

  function gameOver() {
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#f0c040'; ctx.font='bold 32px monospace'; ctx.fillText('GAME OVER',W/2,H/2-20);
    ctx.fillStyle='#e8e8f0'; ctx.font='18px monospace'; ctx.fillText(`Score: ${score}`,W/2,H/2+14);
    ctx.fillStyle='#888'; ctx.font='13px monospace'; ctx.fillText('Click to restart  ·  ESC to quit',W/2,H/2+40);
    ctx.textAlign='left'; active = false;
    canvas.onclick = () => { canvas.onclick=null; resetGame(); active=true; raf=requestAnimationFrame(loop); };
  }

  function loop() {
    if (!active) return;
    frameCount++;
    ctx.clearRect(0,0,W,H);
    drawSky(); drawRoad();
    if (frameCount % 600 === 0) speed = Math.min(speed+0.2,5);

    houses.forEach(h => { h.x -= speed; if (h.flashTimer>0) h.flashTimer--; drawHouse(h); });
    houses = houses.filter(h => h.x > -100);
    if (!houses.length || houses[houses.length-1].x < W-160) spawnHouse(W+60+Math.random()*120);

    obstacles.forEach(o => { o.x -= speed; drawObstacle(o); });
    obstacles = obstacles.filter(o => o.x > -40);
    if (!obstacles.length || obstacles[obstacles.length-1].x < W-280) {
      if (Math.random() < 0.6) spawnObstacle(W+60+Math.random()*80);
    }

    packages.forEach(pkg => {
      pkg.x += pkg.vx; pkg.vy += 0.18; pkg.y += pkg.vy;
      drawPackage(pkg);
      houses.forEach(h => {
        if (!h.delivered && pkg.x+pkg.w>h.x && pkg.x<h.x+h.w && pkg.y+pkg.h>h.y && pkg.y<h.y+h.h) {
          h.delivered=true; h.flashTimer=40; spawnParticles(h.x+h.w/2,h.y+20,'#f0c040');
          score+=10; updateHUD(); pkg.dead=true;
        }
      });
      if (pkg.y > H) pkg.dead = true;
    });
    packages = packages.filter(p => !p.dead);

    const p = player;
    if (keys['ArrowUp'] && p.onGround) { p.vy=-8; p.onGround=false; keys['ArrowUp']=false; }
    p.vy += 0.5; p.y += p.vy;
    if (p.y >= GROUND-p.h) { p.y=GROUND-p.h; p.vy=0; p.onGround=true; }

    particles.forEach(pt => { pt.x+=pt.vx; pt.y+=pt.vy; pt.life--; });
    ctx.save();
    particles.forEach(pt => { ctx.globalAlpha=pt.life/pt.maxLife; ctx.fillStyle=pt.color; ctx.fillRect(pt.x,pt.y,pt.s,pt.s); });
    ctx.restore();
    particles = particles.filter(pt => pt.life>0);

    drawPlayer();

    let dead = false;
    obstacles.forEach(o => {
      if (p.x+22>o.x && p.x+6<o.x+o.w && p.y+p.h>o.y && p.y<o.y+o.h) {
        lives--; updateHUD(); spawnParticles(p.x+14,p.y+14,'#e05a2b'); o.x=-200;
        if (lives<=0) dead=true;
      }
    });
    if (dead) { gameOver(); return; }

    ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(0,H-28,W,28);
    ctx.fillStyle='#888899'; ctx.font='11px monospace';
    ctx.fillText('SPACE = throw  ·  UP = jump  ·  ESC = quit',10,H-10);

    raf = requestAnimationFrame(loop);
  }

  document.addEventListener('keydown', e => {
    if (!active) return;
    if (e.code==='Space') { e.preventDefault(); throwPkg(); }
    if (e.code==='ArrowUp') { e.preventDefault(); if (player.onGround) { player.vy=-8; player.onGround=false; } }
  });
})();
</script>
